[package]
name = "MnemosyneM"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
fastembed = { version = "7.1.0", features = ["qwen3"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
teloxide = { version = "0.17.0", features = ["macros"] }
tokio = { version = "1.53.2", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
candle-core = "0.11.0"
